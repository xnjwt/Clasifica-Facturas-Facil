<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
  <title>Clasificador de Facturas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: var(--app-height, 100svh);
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 420px;
      min-width: 0;
    }
    .progress-bar {
      flex: 1;
      height: 7px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      min-width: 40px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .counter {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .toggle-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .toggle-btn.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 370px;
      grid-template-rows: 1fr auto;
      grid-template-areas:
        "viewer search"
        "viewer actions";
      min-height: 0;
    }
    .viewer-section {
      grid-area: viewer;
      position: relative;
      background: #020617;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .viewer-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .share-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.45);
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0;
      transform: translateY(-4px) scale(0.9);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .share-btn.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .share-btn:hover {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--accent);
      color: #ecfdf5;
    }
    .share-btn:active {
      transform: scale(0.93);
    }
    .share-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .viewer-toast {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translate(-50%, 8px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      border: 1px solid rgba(16, 185, 129, 0.45);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
      max-width: calc(100% - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .viewer-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .viewer-toast.is-error {
      border-color: rgba(239, 68, 68, 0.6);
      color: #fecaca;
    }
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .canvas-wrap:active { cursor: grabbing; }
    #invoice-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .search-area {
      grid-area: search;
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
    }
    .combobox {
      position: relative;
      width: 100%;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    #search-input {
      width: 100%;
      padding: 11px 38px 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input.has-selection {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.1);
      font-weight: 600;
    }
    .clear-btn {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: var(--panel-hover);
      color: var(--text);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clear-btn:hover { background: #475569; }
    .dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: min(46svh, 360px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 40;
    }
    .dropdown-hint {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 4px 8px 2px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .project-item {
      width: 100%;
      text-align: left;
      padding: 10px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .project-item:hover,
    .project-item.active {
      background: var(--panel-hover);
    }
    .project-item.selected {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.18);
      font-weight: 600;
    }
    .usage-badge {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(16, 185, 129, 0.14);
      padding: 2px 7px;
      border-radius: 999px;
    }
    .empty-item {
      color: var(--muted);
      font-size: 0.86rem;
      padding: 10px;
      text-align: center;
    }
    .actions-area {
      grid-area: actions;
      background: var(--panel);
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-primary {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #022c22;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .secondary-row {
      display: flex;
      gap: 8px;
    }
    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-secondary:hover { background: var(--panel-hover); color: var(--text); }
    .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-skip { border-color: rgba(245, 158, 11, 0.45); color: var(--warn); }
    .btn-skip:hover { background: rgba(245, 158, 11, 0.14); color: #fde68a; }
    .status-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 24px;
    }
    .status-screen h2 { font-size: 1.35rem; }
    .status-screen p { color: var(--muted); max-width: 420px; line-height: 1.5; }
    .error-banner {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid var(--danger);
      color: #fecaca;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
    }
    .hidden { display: none !important; }
    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
          "search"
          "viewer"
          "actions";
      }
      .search-area {
        border-left: none;
        border-bottom: 1px solid var(--border);
        padding: 10px 12px;
      }
      .actions-area {
        border-left: none;
        padding: 10px 12px;
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      .secondary-row {
        flex: 0 0 auto;
        gap: 6px;
      }
      .btn-secondary {
        padding: 11px 10px;
        font-size: 0.82rem;
      }
      .btn-primary {
        flex: 1;
        padding: 11px 12px;
        font-size: 0.92rem;
      }
      .dropdown {
        max-height: min(44svh, 280px);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="progress-wrap">
      <div class="counter" id="counter">Cargando...</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <button class="toggle-btn" id="mode-toggle" type="button">Ver clasificadas</button>
  </header>

  <div class="status-screen" id="status-screen">
    <h2 id="status-title">Cargando facturas...</h2>
    <p id="status-desc">Conectando con el servidor.</p>
    <button class="toggle-btn hidden" id="status-action" type="button">Revisar todas las facturas</button>
  </div>

  <main class="hidden" id="workspace">
    <section class="search-area">
      <div class="error-banner hidden" id="error-banner"></div>
      <div class="combobox" id="combobox">
        <div class="input-wrap">
          <input
            id="search-input"
            type="text"
            placeholder="¿A qué proyecto pertenece esta factura?"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          >
          <button class="clear-btn hidden" id="clear-btn" type="button" aria-label="Limpiar">×</button>
        </div>
        <div class="dropdown hidden" id="dropdown"></div>
      </div>
    </section>

    <section class="viewer-section">
      <div class="viewer-toolbar">
        <button
          class="share-btn"
          id="share-btn"
          type="button"
          aria-label="Compartir factura y copiar proyecto"
          title="Compartir factura y copiar nombre del proyecto"
          aria-hidden="true"
          tabindex="-1"
        >
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
      </div>
      <div class="viewer-toast" id="viewer-toast" role="status" aria-live="polite"></div>
      <div class="canvas-wrap" id="canvas-wrap">
        <img id="invoice-img" alt="Factura">
      </div>
    </section>

    <section class="actions-area">
      <div class="secondary-row">
        <button class="btn-secondary" id="prev-btn" type="button">← Ant.</button>
        <button class="btn-secondary btn-skip" id="skip-btn" type="button">No la sé</button>
      </div>
      <button class="btn-primary hidden" id="next-btn" type="button">Guardar y siguiente →</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://tljfkccpgusxfdcnginh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fGoeAQ7vc2iWdUgi7X-16w_71UxTvwb";
    const BUCKET_NAME = "facturas";

    const IMAGE_EXTENSIONS = /\.(jpe?g|png|webp|gif|bmp)$/i;

    const state = {
      db: null,
      allFiles: [],
      projects: [],
      classifications: new Map(),
      queue: [],
      index: 0,
      selectedProject: null,
      showAll: false,
      dropdownOpen: false,
      visibleItems: [],
      activeIndex: -1,
      fuse: null,
      panzoom: null,
      busy: false,
      sharing: false,
      cachedShareFile: null,
      cachedShareName: null,
      cachedSharePromise: null,
      shareCacheId: 0,
      toastTimer: null,
      shouldSelectOnTap: false,
      lastViewportWidth: window.innerWidth
    };

    const el = {
      counter: document.getElementById("counter"),
      progressFill: document.getElementById("progress-fill"),
      modeToggle: document.getElementById("mode-toggle"),
      statusScreen: document.getElementById("status-screen"),
      statusTitle: document.getElementById("status-title"),
      statusDesc: document.getElementById("status-desc"),
      statusAction: document.getElementById("status-action"),
      workspace: document.getElementById("workspace"),
      combobox: document.getElementById("combobox"),
      searchInput: document.getElementById("search-input"),
      clearBtn: document.getElementById("clear-btn"),
      dropdown: document.getElementById("dropdown"),
      shareBtn: document.getElementById("share-btn"),
      viewerToast: document.getElementById("viewer-toast"),
      canvasWrap: document.getElementById("canvas-wrap"),
      invoiceImg: document.getElementById("invoice-img"),
      nextBtn: document.getElementById("next-btn"),
      prevBtn: document.getElementById("prev-btn"),
      skipBtn: document.getElementById("skip-btn"),
      errorBanner: document.getElementById("error-banner")
    };

    function normalizeText(value) {
      return value
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function buildPublicUrl(fileName) {
      return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${encodeURIComponent(fileName)}`;
    }

    function guessMimeType(fileName) {
      const ext = fileName.split(".").pop().toLowerCase();
      const map = {
        jpg: "image/jpeg",
        jpeg: "image/jpeg",
        png: "image/png",
        webp: "image/webp",
        gif: "image/gif",
        bmp: "image/bmp"
      };
      return map[ext] || "image/jpeg";
    }

    function showToast(message, isError = false) {
      if (!message) return;
      clearTimeout(state.toastTimer);
      el.viewerToast.textContent = message;
      el.viewerToast.classList.toggle("is-error", isError);
      el.viewerToast.classList.add("show");
      state.toastTimer = setTimeout(() => {
        el.viewerToast.classList.remove("show");
      }, 2400);
    }

    async function copyTextToClipboard(text) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "-9999px";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) return true;
      } catch {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          return false;
        }
      }
      return false;
    }
    // Precarga el archivo original en memoria para que navigator.share() abra al instante sin perder el gesto del usuario
    function prefetchShareFile(fileName) {
      const requestId = ++state.shareCacheId;
      state.cachedShareFile = null;
      state.cachedShareName = fileName;
      state.cachedSharePromise = fetch(buildPublicUrl(fileName), { mode: "cors" })
        .then((res) => {
          if (!res.ok) throw new Error("No se pudo descargar la imagen.");
          return res.blob();
        })
        .then((blob) => {
          const file = new File([blob], fileName, { type: blob.type || guessMimeType(fileName) });
          if (state.shareCacheId === requestId) {
            state.cachedShareFile = file;
          }
          return file;
        })
        .catch(() => null);
    }

    async function shareCurrentInvoice() {
      if (state.sharing || !state.selectedProject || state.queue.length === 0) return;

      const projectName = state.selectedProject;
      const currentFile = state.queue[state.index];

      // 1. Copia sin bloquear el hilo principal para no consumir el gesto táctil en iOS
      const copyPromise = copyTextToClipboard(projectName);

      if (!navigator.share) {
        const copied = await copyPromise;
        showToast(
          copied
            ? "Proyecto copiado (usa HTTPS para compartir)"
            : "Compartir no disponible en este contexto",
          !copied
        );
        return;
      }

      // 2. Si aún no termina de bajar la foto, avisa en vez de dejar que iOS lance NotAllowedError
      const file = state.cachedShareName === currentFile ? state.cachedShareFile : null;
      if (!file) {
        await copyPromise;
        showToast("La imagen aún está cargando, intenta de nuevo en 1s");
        return;
      }

      state.sharing = true;
      el.shareBtn.disabled = true;

      try {
        const shareData = { files: [file] };

        if (navigator.canShare && !navigator.canShare(shareData)) {
          const copied = await copyPromise;
          showToast(copied ? "Proyecto copiado" : "No se puede compartir este archivo", !copied);
          return;
        }

        // 3. Llamada inmediata a navigator.share mientras el toque sigue activo en Safari
        const sharePromise = navigator.share(shareData);
        const copied = await copyPromise;
        if (copied) {
          showToast("Proyecto copiado al portapapeles");
        }
        await sharePromise;
      } catch (error) {
        if (error.name !== "AbortError") {
          showToast(`Error al compartir: ${error.message}`, true);
        }
      } finally {
        state.sharing = false;
        el.shareBtn.disabled = false;
      }
    }
    // Mantiene fija la altura del contenedor cuando se abre el teclado virtual en celular
    function lockAppHeight(force = false) {
      const widthChanged = window.innerWidth !== state.lastViewportWidth;
      const isInputFocused = document.activeElement === el.searchInput;
      if (!force && isInputFocused && !widthChanged) {
        return;
      }
      state.lastViewportWidth = window.innerWidth;
      document.documentElement.style.setProperty("--app-height", `${window.innerHeight}px`);
    }

    // Ajusta el alto del dropdown para que siempre sea visible encima del teclado virtual
    function updateDropdownMaxHeight() {
      if (!state.dropdownOpen) return;
      const vvHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const vvTop = window.visualViewport ? window.visualViewport.offsetTop : 0;
      const rect = el.combobox.getBoundingClientRect();
      const cap = window.innerWidth <= 820 ? 280 : 360;
      const available = Math.floor((vvTop + vvHeight) - rect.bottom - 14);
      el.dropdown.style.maxHeight = `${Math.max(120, Math.min(available, cap))}px`;
    }

    // Selecciona todo el texto de forma confiable en iOS Safari y Android Chrome
    function selectAllInputText() {
      const len = el.searchInput.value.length;
      if (!len) return;
      const applySelection = () => {
        if (document.activeElement !== el.searchInput) return;
        try {
          el.searchInput.setSelectionRange(0, el.searchInput.value.length);
        } catch {
          el.searchInput.select();
        }
      };
      applySelection();
      setTimeout(applySelection, 0);
    }

    function dismissSearchFocus() {
      if (state.dropdownOpen) {
        closeDropdown();
      }
      if (document.activeElement === el.searchInput) {
        el.searchInput.blur();
      }
    }

    function getUsageCounts() {
      const counts = new Map();
      for (const row of state.classifications.values()) {
        if (row.proyecto_nombre) {
          counts.set(row.proyecto_nombre, (counts.get(row.proyecto_nombre) || 0) + 1);
        }
      }
      return counts;
    }

    function getProjectsSortedByUsage(counts) {
      return [...state.projects].sort((a, b) => {
        const diff = (counts.get(b.nombre) || 0) - (counts.get(a.nombre) || 0);
        if (diff !== 0) return diff;
        return a.nombre.localeCompare(b.nombre, "es");
      });
    }

    function showError(message) {
      if (!message) {
        el.errorBanner.classList.add("hidden");
        el.errorBanner.textContent = "";
        return;
      }
      el.errorBanner.textContent = message;
      el.errorBanner.classList.remove("hidden");
    }

    function showStatus(title, desc, showReviewButton = false) {
      el.workspace.classList.add("hidden");
      el.statusScreen.classList.remove("hidden");
      el.statusTitle.textContent = title;
      el.statusDesc.textContent = desc;
      el.statusAction.classList.toggle("hidden", !showReviewButton);
    }

    function setupPanzoom() {
      state.panzoom = Panzoom(el.invoiceImg, {
        maxScale: 6,
        minScale: 1,
        step: 0.45
      });
      el.canvasWrap.addEventListener("wheel", (event) => {
        event.preventDefault();
        state.panzoom.zoomWithWheel(event);
      }, { passive: false });
    }

    function openDropdown() {
      state.dropdownOpen = true;
      el.dropdown.classList.remove("hidden");
      renderDropdown();
      updateDropdownMaxHeight();
    }

    function closeDropdown() {
      state.dropdownOpen = false;
      state.activeIndex = -1;
      el.dropdown.classList.add("hidden");
    }

    function syncInputState() {
      const hasText = el.searchInput.value.length > 0;
      const hasProject = Boolean(state.selectedProject);
      el.clearBtn.classList.toggle("hidden", !hasText);
      el.searchInput.classList.toggle("has-selection", hasProject);
      el.nextBtn.classList.toggle("hidden", !hasProject);
      el.shareBtn.classList.toggle("visible", hasProject);
      el.shareBtn.setAttribute("aria-hidden", String(!hasProject));
      el.shareBtn.tabIndex = hasProject ? 0 : -1;
    }

    function selectProject(projectName) {
      state.selectedProject = projectName;
      el.searchInput.value = projectName || "";
      syncInputState();
      closeDropdown();
      el.searchInput.blur();
    }

    function renderDropdown() {
      if (!state.dropdownOpen) return;

      const counts = getUsageCounts();
      const rawQuery = el.searchInput.value.trim();
      const showingDefault = !rawQuery || rawQuery === state.selectedProject;

      let items;
      if (showingDefault) {
        items = getProjectsSortedByUsage(counts).slice(0, 40);
      } else {
        const cleanQuery = normalizeText(rawQuery);
        items = state.fuse.search(cleanQuery, { limit: 25 }).map((r) => r.item);
      }

      state.visibleItems = items;
      if (state.activeIndex >= items.length) {
        state.activeIndex = items.length ? 0 : -1;
      }

      el.dropdown.innerHTML = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-item";
        empty.textContent = "Sin coincidencias. Prueba otra palabra.";
        el.dropdown.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      if (showingDefault) {
        const hint = document.createElement("div");
        hint.className = "dropdown-hint";
        const hasAnyUsage = [...counts.values()].some((v) => v > 0);
        hint.textContent = hasAnyUsage ? "Ordenados por más usados" : "Proyectos disponibles";
        fragment.appendChild(hint);
      }

      items.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "project-item";
        if (state.selectedProject === item.nombre) btn.classList.add("selected");
        if (idx === state.activeIndex) btn.classList.add("active");

        const label = document.createElement("span");
        label.textContent = item.nombre;
        btn.appendChild(label);

        const uses = counts.get(item.nombre) || 0;
        if (uses > 0) {
          const badge = document.createElement("span");
          badge.className = "usage-badge";
          badge.textContent = `${uses}×`;
          btn.appendChild(badge);
        }

        btn.addEventListener("click", () => selectProject(item.nombre));
        fragment.appendChild(btn);
      });

      el.dropdown.appendChild(fragment);
    }

    function rebuildQueue(keepCurrentFile = null) {
      state.queue = state.showAll
        ? [...state.allFiles]
        : state.allFiles.filter((name) => !state.classifications.has(name));

      if (keepCurrentFile) {
        const foundIdx = state.queue.indexOf(keepCurrentFile);
        state.index = foundIdx >= 0 ? foundIdx : 0;
      } else {
        state.index = Math.min(state.index, Math.max(0, state.queue.length - 1));
      }
      renderCurrent();
    }

    function updateProgress() {
      const total = state.allFiles.length;
      const done = state.allFiles.filter((name) => state.classifications.has(name)).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      el.progressFill.style.width = `${pct}%`;
      if (state.queue.length === 0) {
        el.counter.textContent = `${done}/${total} listas`;
      } else { 
        el.counter.textContent = `${state.index + 1}/${state.queue.length}`;
      }
    }

    function preloadNextImage() {
      const nextFile = state.queue[state.index + 1];
      if (!nextFile) return;
      const img = new Image();
      img.src = buildPublicUrl(nextFile);
    }

    function renderCurrent() {
      updateProgress();
      showError("");
      closeDropdown();

      if (state.allFiles.length === 0) {
        showStatus("No hay facturas en la carpeta", "Sube imágenes al bucket 'facturas' en Supabase y recarga esta página.");
        return;
      }

      if (state.queue.length === 0) {
        showStatus(
          "¡Todo clasificado!",
          `Se completaron las ${state.allFiles.length} facturas disponibles. Ya puedes cerrar esta pestaña.`,
          true
        );
        return;
      }

      el.statusScreen.classList.add("hidden");
      el.workspace.classList.remove("hidden");

      const currentFile = state.queue[state.index];
      const existing = state.classifications.get(currentFile);

      el.invoiceImg.src = buildPublicUrl(currentFile);
      prefetchShareFile(currentFile);
      state.panzoom.reset({ animate: false });

      el.prevBtn.disabled = state.index === 0;
      el.nextBtn.textContent = state.index === state.queue.length - 1 ? "Guardar y fin ✓" : "Guardar y sig. →";

      if (existing && existing.proyecto_nombre) {
        state.selectedProject = existing.proyecto_nombre;
        el.searchInput.value = existing.proyecto_nombre;
        el.searchInput.placeholder = "Toca para elegir o busca el proyecto...";
      } else {
        state.selectedProject = null;
        el.searchInput.value = "";
        el.searchInput.placeholder = existing && existing.estado === "no_reconocida"
          ? "Marcada como no reconocida (toca para cambiar)"
          : "¿A qué proyecto pertenece esta factura?";
      }

      syncInputState();
      preloadNextImage();
    }

    async function saveClassification(estado, proyectoNombre) {
      if (state.busy || state.queue.length === 0) return;
      state.busy = true;
      el.nextBtn.disabled = true;
      el.skipBtn.disabled = true;
      showError("");

      const currentFile = state.queue[state.index];
      const payload = {
        archivo: currentFile,
        proyecto_nombre: proyectoNombre,
        estado,
        actualizado_en: new Date().toISOString()
      };

      const { error } = await state.db
        .from("clasificaciones")
        .upsert(payload, { onConflict: "archivo" });

      state.busy = false;
      el.nextBtn.disabled = false;
      el.skipBtn.disabled = false;

      if (error) {
        showError(`No se pudo guardar: ${error.message}`);
        return;
      }

      state.classifications.set(currentFile, payload);

      if (state.showAll) {
        if (state.index < state.queue.length - 1) {
          state.index += 1;
          renderCurrent();
        } else {
          updateProgress();
          showStatus(
            "Revisión completada",
            "Todos los cambios quedaron guardados en el servidor.",
            true
          );
        }
      } else {
        state.queue.splice(state.index, 1);
        if (state.index >= state.queue.length) {
          state.index = Math.max(0, state.queue.length - 1);
        }
        renderCurrent();
      }
    }

    function bindEvents() {
      lockAppHeight(true);

      window.addEventListener("resize", () => {
        lockAppHeight();
        updateDropdownMaxHeight();
      });

      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          lockAppHeight(true);
          updateDropdownMaxHeight();
        }, 150);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateDropdownMaxHeight);
        window.visualViewport.addEventListener("scroll", updateDropdownMaxHeight);
      }

      el.searchInput.addEventListener("focus", () => {
        state.activeIndex = -1;
        openDropdown();
        if (el.searchInput.value) {
          state.shouldSelectOnTap = true;
          selectAllInputText();
        }
      });

      el.searchInput.addEventListener("mouseup", (event) => {
        if (state.shouldSelectOnTap) {
          event.preventDefault();
        }
      });

      el.searchInput.addEventListener("click", () => {
        if (!state.dropdownOpen) {
          openDropdown();
        }
        if (
          state.shouldSelectOnTap ||
          (state.selectedProject && el.searchInput.value === state.selectedProject)
        ) {
          state.shouldSelectOnTap = false;
          selectAllInputText();
        }
      });

      el.searchInput.addEventListener("blur", () => {
        state.shouldSelectOnTap = false;
        setTimeout(() => {
          if (document.activeElement !== el.searchInput) {
            lockAppHeight();
            window.scrollTo(0, 0);
          }
        }, 200);
      });

      el.searchInput.addEventListener("input", () => {
        state.shouldSelectOnTap = false;
        if (el.searchInput.value !== state.selectedProject) {
          state.selectedProject = null;
        }
        state.activeIndex = 0;
        syncInputState();
        openDropdown();
      });

      el.searchInput.addEventListener("keydown", (event) => {
        if (!state.dropdownOpen && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
          openDropdown();
          return;
        }
        if (event.key === "Escape") {
          dismissSearchFocus();
          return;
        }
        if (!state.visibleItems.length) return;
        if (event.key === "ArrowDown") {
          event.preventDefault();
          state.activeIndex = (state.activeIndex + 1) % state.visibleItems.length;
          renderDropdown();
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          state.activeIndex = (state.activeIndex - 1 + state.visibleItems.length) % state.visibleItems.length;
          renderDropdown();
        } else if (event.key === "Enter" && state.dropdownOpen) {
          event.preventDefault();
          const chosen = state.visibleItems[state.activeIndex >= 0 ? state.activeIndex : 0];
          if (chosen) selectProject(chosen.nombre);
        }
      });

      el.clearBtn.addEventListener("click", () => {
        state.selectedProject = null;
        state.shouldSelectOnTap = false;
        el.searchInput.value = "";
        state.activeIndex = -1;
        syncInputState();
        el.searchInput.focus();
        openDropdown();
      });

      // Captura toques fuera del combobox antes de que Panzoom intercepte el evento en el visor
      document.addEventListener("pointerdown", (event) => {
        if (!el.combobox.contains(event.target)) {
          dismissSearchFocus();
        }
      }, { capture: true });

      el.shareBtn.addEventListener("click", shareCurrentInvoice);

      el.nextBtn.addEventListener("click", () => {
        if (state.selectedProject) {
          saveClassification("clasificada", state.selectedProject);
        }
      });

      el.skipBtn.addEventListener("click", () => saveClassification("no_reconocida", null));

      el.prevBtn.addEventListener("click", () => {
        if (state.index > 0) {
          state.index -= 1;
          renderCurrent();
        }
      });

      el.modeToggle.addEventListener("click", () => {
        const currentFile = state.queue[state.index] || null;
        state.showAll = !state.showAll;
        el.modeToggle.classList.toggle("active", state.showAll);
        el.modeToggle.textContent = state.showAll ? "Solo pendientes" : "Ver clasificadas";
        rebuildQueue(currentFile);
      });

      el.statusAction.addEventListener("click", () => {
        state.showAll = true;
        el.modeToggle.classList.add("active");
        el.modeToggle.textContent = "Solo pendientes";
        state.index = 0;
        rebuildQueue();
      });
    }

    async function init() {
      if (SUPABASE_KEY.includes("PEGA_AQUI")) {
        showStatus("Falta configurar tu llave", "Reemplaza PEGA_AQUI_TU_PUBLISHABLE_KEY en index.html con tu Publishable key de Supabase.");
        return;
      }

      state.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      setupPanzoom();
      bindEvents();

      const [filesRes, projectsRes, classRes] = await Promise.all([
        state.db.storage.from(BUCKET_NAME).list("", { limit: 1000, sortBy: { column: "name", order: "asc" } }),
        state.db.from("proyectos").select("nombre").order("nombre", { ascending: true }),
        state.db.from("clasificaciones").select("archivo, proyecto_nombre, estado")
      ]);

      if (filesRes.error || projectsRes.error || classRes.error) {
        const msg = (filesRes.error || projectsRes.error || classRes.error).message;
        showStatus("Error al conectar con Supabase", msg);
        return;
      }

      state.allFiles = (filesRes.data || [])
        .map((f) => f.name)
        .filter((name) => IMAGE_EXTENSIONS.test(name));

      state.projects = (projectsRes.data || []).map((p) => ({
        nombre: p.nombre,
        normalized: normalizeText(p.nombre)
      }));

      state.fuse = new Fuse(state.projects, {
        keys: ["normalized"],
        ignoreLocation: true,
        threshold: 0.42
      });

      state.classifications = new Map(
        (classRes.data || []).map((row) => [row.archivo, row])
      );

      rebuildQueue();
    }

    init();
  </script>
</body>
</html>
