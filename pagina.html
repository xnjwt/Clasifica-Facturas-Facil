<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clasificador de Facturas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 420px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .counter {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .toggle-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .toggle-btn.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      min-height: 0;
    }
    .viewer-section {
      position: relative;
      background: #020617;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .viewer-toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }
    .filename-badge {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      max-width: 65%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: auto;
    }
    .zoom-controls {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }
    .zoom-btn {
      background: rgba(30, 41, 59, 0.9);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .zoom-btn:hover { background: var(--panel-hover); }
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .canvas-wrap:active { cursor: grabbing; }
    #invoice-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .controls-section {
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .search-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }
    #search-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    #search-input:focus { border-color: var(--accent); }
    .results-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      min-height: 0;
    }
    .project-item {
      text-align: left;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.55);
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.3;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .project-item:hover { background: var(--panel-hover); }
    .project-item.selected {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.18);
      font-weight: 600;
    }
    .selected-preview {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--accent);
      font-size: 0.85rem;
      line-height: 1.35;
    }
    .selected-preview span {
      display: block;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #022c22;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .secondary-row {
      display: flex;
      gap: 8px;
    }
    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover { background: var(--panel-hover); color: var(--text); }
    .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-skip { border-color: rgba(245, 158, 11, 0.45); color: var(--warn); }
    .btn-skip:hover { background: rgba(245, 158, 11, 0.14); color: #fde68a; }
    .status-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 24px;
    }
    .status-screen h2 { font-size: 1.4rem; }
    .status-screen p { color: var(--muted); max-width: 420px; line-height: 1.5; }
    .error-banner {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid var(--danger);
      color: #fecaca;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
    }
    .hidden { display: none !important; }
    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 46dvh 1fr;
      }
      .controls-section {
        border-left: none;
        border-top: 1px solid var(--border);
        padding: 12px;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="progress-wrap">
      <div class="counter" id="counter">Cargando...</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <button class="toggle-btn" id="mode-toggle" type="button">Ver ya clasificadas</button>
  </header>

  <div class="status-screen" id="status-screen">
    <h2 id="status-title">Cargando facturas...</h2>
    <p id="status-desc">Conectando con el servidor.</p>
    <button class="toggle-btn hidden" id="status-action" type="button">Revisar todas las facturas</button>
  </div>

  <main class="hidden" id="workspace">
    <section class="viewer-section">
      <div class="viewer-toolbar">
        <div class="filename-badge" id="filename-badge"></div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoom-out" type="button">-</button>
          <button class="zoom-btn" id="zoom-reset" type="button">100%</button>
          <button class="zoom-btn" id="zoom-in" type="button">+</button>
        </div>
      </div>
      <div class="canvas-wrap" id="canvas-wrap">
        <img id="invoice-img" alt="Factura">
      </div>
    </section>

    <section class="controls-section">
      <div class="error-banner hidden" id="error-banner"></div>
      <label class="search-label" for="search-input">Busca y selecciona el proyecto</label>
      <input id="search-input" type="search" placeholder="Escribe cualquier palabra del proyecto..." autocomplete="off">

      <div class="results-list" id="results-list"></div>

      <div class="selected-preview hidden" id="selected-preview">
        <span>Proyecto seleccionado</span>
        <div id="selected-name"></div>
      </div>

      <div class="action-stack">
        <button class="btn-primary hidden" id="next-btn" type="button">Guardar y siguiente →</button>
        <div class="secondary-row">
          <button class="btn-secondary" id="prev-btn" type="button">← Anterior</button>
          <button class="btn-secondary btn-skip" id="skip-btn" type="button">No la reconozco</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://tljfkccpgusxfdcnginh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fGoeAQ7vc2iWdUgi7X-16w_71UxTvwb";
    const BUCKET_NAME = "facturas";

    const IMAGE_EXTENSIONS = /\.(jpe?g|png|webp|gif|bmp)$/i;

    const state = {
      db: null,
      allFiles: [],
      projects: [],
      classifications: new Map(),
      queue: [],
      index: 0,
      selectedProject: null,
      showAll: false,
      fuse: null,
      panzoom: null,
      busy: false
    };

    const el = {
      counter: document.getElementById("counter"),
      progressFill: document.getElementById("progress-fill"),
      modeToggle: document.getElementById("mode-toggle"),
      statusScreen: document.getElementById("status-screen"),
      statusTitle: document.getElementById("status-title"),
      statusDesc: document.getElementById("status-desc"),
      statusAction: document.getElementById("status-action"),
      workspace: document.getElementById("workspace"),
      filenameBadge: document.getElementById("filename-badge"),
      canvasWrap: document.getElementById("canvas-wrap"),
      invoiceImg: document.getElementById("invoice-img"),
      zoomIn: document.getElementById("zoom-in"),
      zoomOut: document.getElementById("zoom-out"),
      zoomReset: document.getElementById("zoom-reset"),
      searchInput: document.getElementById("search-input"),
      resultsList: document.getElementById("results-list"),
      selectedPreview: document.getElementById("selected-preview"),
      selectedName: document.getElementById("selected-name"),
      nextBtn: document.getElementById("next-btn"),
      prevBtn: document.getElementById("prev-btn"),
      skipBtn: document.getElementById("skip-btn"),
      errorBanner: document.getElementById("error-banner")
    };

    function normalizeText(value) {
      return value
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function buildPublicUrl(fileName) {
      return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${encodeURIComponent(fileName)}`;
    }

    function showError(message) {
      if (!message) {
        el.errorBanner.classList.add("hidden");
        el.errorBanner.textContent = "";
        return;
      }
      el.errorBanner.textContent = message;
      el.errorBanner.classList.remove("hidden");
    }

    function showStatus(title, desc, showReviewButton = false) {
      el.workspace.classList.add("hidden");
      el.statusScreen.classList.remove("hidden");
      el.statusTitle.textContent = title;
      el.statusDesc.textContent = desc;
      el.statusAction.classList.toggle("hidden", !showReviewButton);
    }

    function setupPanzoom() {
      state.panzoom = Panzoom(el.invoiceImg, {
        maxScale: 6,
        minScale: 1,
        step: 0.45
      });
      el.canvasWrap.addEventListener("wheel", (event) => {
        event.preventDefault();
        state.panzoom.zoomWithWheel(event);
      }, { passive: false });
      el.zoomIn.addEventListener("click", () => state.panzoom.zoomIn());
      el.zoomOut.addEventListener("click", () => state.panzoom.zoomOut());
      el.zoomReset.addEventListener("click", () => state.panzoom.reset());
    }

    function rebuildQueue(keepCurrentFile = null) {
      state.queue = state.showAll
        ? [...state.allFiles]
        : state.allFiles.filter((name) => !state.classifications.has(name));

      if (keepCurrentFile) {
        const foundIdx = state.queue.indexOf(keepCurrentFile);
        state.index = foundIdx >= 0 ? foundIdx : 0;
      } else {
        state.index = Math.min(state.index, Math.max(0, state.queue.length - 1));
      }
      renderCurrent();
    }

    function updateProgress() {
      const total = state.allFiles.length;
      const done = state.allFiles.filter((name) => state.classifications.has(name)).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      el.progressFill.style.width = `${pct}%`;
      if (state.queue.length === 0) {
        el.counter.textContent = `${done} de ${total} listas`;
      } else {
        el.counter.textContent = `Factura ${state.index + 1} de ${state.queue.length} (${done}/${total})`;
      }
    }

    function preloadNextImage() {
      const nextFile = state.queue[state.index + 1];
      if (!nextFile) return;
      const img = new Image();
      img.src = buildPublicUrl(nextFile);
    }

    function setSelection(projectName) {
      state.selectedProject = projectName;
      if (projectName) {
        el.selectedName.textContent = projectName;
        el.selectedPreview.classList.remove("hidden");
        el.nextBtn.classList.remove("hidden");
      } else {
        el.selectedPreview.classList.add("hidden");
        el.nextBtn.classList.add("hidden");
      }
      renderProjectResults();
    }

    function renderProjectResults() {
      const rawQuery = el.searchInput.value.trim();
      let items;
      if (!rawQuery) {
        items = state.projects.slice(0, 40);
      } else {
        const cleanQuery = normalizeText(rawQuery);
        items = state.fuse.search(cleanQuery, { limit: 25 }).map((r) => r.item);
      }

      el.resultsList.innerHTML = "";
      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.style.color = "var(--muted)";
        empty.style.fontSize = "0.88rem";
        empty.style.padding = "8px";
        empty.textContent = "Sin coincidencias. Prueba con otra palabra.";
        el.resultsList.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const item of items) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "project-item" + (state.selectedProject === item.nombre ? " selected" : "");
        btn.textContent = item.nombre;
        btn.addEventListener("click", () => setSelection(item.nombre));
        fragment.appendChild(btn);
      }
      el.resultsList.appendChild(fragment);
    }

    function renderCurrent() {
      updateProgress();
      showError("");

      if (state.allFiles.length === 0) {
        showStatus("No hay facturas en la carpeta", "Sube imágenes al bucket 'facturas' en Supabase y recarga esta página.");
        return;
      }

      if (state.queue.length === 0) {
        showStatus(
          "¡Todo clasificado!",
          `Se completaron las ${state.allFiles.length} facturas disponibles. Ya puedes cerrar esta pestaña.`,
          true
        );
        return;
      }

      el.statusScreen.classList.add("hidden");
      el.workspace.classList.remove("hidden");

      const currentFile = state.queue[state.index];
      const existing = state.classifications.get(currentFile);

      el.filenameBadge.textContent = currentFile;
      el.invoiceImg.src = buildPublicUrl(currentFile);
      state.panzoom.reset({ animate: false });

      el.searchInput.value = "";
      el.prevBtn.disabled = state.index === 0;
      el.nextBtn.textContent = state.index === state.queue.length - 1 ? "Guardar y finalizar ✓" : "Guardar y siguiente →";

      setSelection(existing && existing.proyecto_nombre ? existing.proyecto_nombre : null);
      preloadNextImage();
    }

    async function saveClassification(estado, proyectoNombre) {
      if (state.busy || state.queue.length === 0) return;
      state.busy = true;
      el.nextBtn.disabled = true;
      el.skipBtn.disabled = true;
      showError("");

      const currentFile = state.queue[state.index];
      const payload = {
        archivo: currentFile,
        proyecto_nombre: proyectoNombre,
        estado,
        actualizado_en: new Date().toISOString()
      };

      const { error } = await state.db
        .from("clasificaciones")
        .upsert(payload, { onConflict: "archivo" });

      state.busy = false;
      el.nextBtn.disabled = false;
      el.skipBtn.disabled = false;

      if (error) {
        showError(`No se pudo guardar: ${error.message}`);
        return;
      }

      state.classifications.set(currentFile, payload);

      if (state.showAll) {
        if (state.index < state.queue.length - 1) {
          state.index += 1;
          renderCurrent();
        } else {
          updateProgress();
          showStatus(
            "Revisión completada",
            "Todos los cambios quedaron guardados en el servidor.",
            true
          );
        }
      } else {
        state.queue.splice(state.index, 1);
        if (state.index >= state.queue.length) {
          state.index = Math.max(0, state.queue.length - 1);
        }
        renderCurrent();
      }
    }

    async function init() {
      if (SUPABASE_KEY.includes("PEGA_AQUI")) {
        showStatus("Falta configurar tu llave", "Reemplaza PEGA_AQUI_TU_PUBLISHABLE_KEY en index.html con tu Publishable key de Supabase.");
        return;
      }

      state.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      setupPanzoom();

      const [filesRes, projectsRes, classRes] = await Promise.all([
        state.db.storage.from(BUCKET_NAME).list("", { limit: 1000, sortBy: { column: "name", order: "asc" } }),
        state.db.from("proyectos").select("nombre").order("nombre", { ascending: true }),
        state.db.from("clasificaciones").select("archivo, proyecto_nombre, estado")
      ]);

      if (filesRes.error || projectsRes.error || classRes.error) {
        const msg = (filesRes.error || projectsRes.error || classRes.error).message;
        showStatus("Error al conectar con Supabase", msg);
        return;
      }

      state.allFiles = (filesRes.data || [])
        .map((f) => f.name)
        .filter((name) => IMAGE_EXTENSIONS.test(name));

      state.projects = (projectsRes.data || []).map((p) => ({
        nombre: p.nombre,
        normalized: normalizeText(p.nombre)
      }));

      state.fuse = new Fuse(state.projects, {
        keys: ["normalized"],
        ignoreLocation: true,
        threshold: 0.42
      });

      state.classifications = new Map(
        (classRes.data || []).map((row) => [row.archivo, row])
      );

      el.searchInput.addEventListener("input", renderProjectResults);
      el.nextBtn.addEventListener("click", () => {
        if (state.selectedProject) {
          saveClassification("clasificada", state.selectedProject);
        }
      });
      el.skipBtn.addEventListener("click", () => saveClassification("no_reconocida", null));
      el.prevBtn.addEventListener("click", () => {
        if (state.index > 0) {
          state.index -= 1;
          renderCurrent();
        }
      });
      el.modeToggle.addEventListener("click", () => {
        const currentFile = state.queue[state.index] || null;
        state.showAll = !state.showAll;
        el.modeToggle.classList.toggle("active", state.showAll);
        el.modeToggle.textContent = state.showAll ? "Ver solo pendientes" : "Ver ya clasificadas";
        rebuildQueue(currentFile);
      });
      el.statusAction.addEventListener("click", () => {
        state.showAll = true;
        el.modeToggle.classList.add("active");
        el.modeToggle.textContent = "Ver solo pendientes";
        state.index = 0;
        rebuildQueue();
      });

      rebuildQueue();
    }

    init();
  </script>
</body>
</html>
